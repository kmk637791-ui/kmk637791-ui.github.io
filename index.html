<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Donut</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #F0F0F0; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three"
import { OrbitControls } from "three/addons/controls/OrbitControls.js"
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js"

const MODEL_URL = "https://raw.githubusercontent.com/kmk637791-ui/kmk637791-ui.github.io/main/Glass%20Donut.glb"

const scene = new THREE.Scene()
scene.background = new THREE.Color(0xF0F0F0)

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000)
camera.position.set(0, 1.5, 5)

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(window.devicePixelRatio)
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.2
document.body.appendChild(renderer.domElement)

const ambient = new THREE.AmbientLight(0xffffff, 0.5)
scene.add(ambient)

const dir1 = new THREE.DirectionalLight(0xffffff, 2.0)
dir1.position.set(5, 5, 5)
dir1.castShadow = true
scene.add(dir1)

const dir2 = new THREE.DirectionalLight(0x8888ff, 1.0)
dir2.position.set(-5, -2, -3)
scene.add(dir2)

const dir3 = new THREE.DirectionalLight(0xffeecc, 0.8)
dir3.position.set(0, 5, -5)
scene.add(dir3)

const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.dampingFactor = 0.08
controls.enableZoom = true
controls.enablePan = false

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color("#aaddff"),
  roughness: 0.05,
  metalness: 0.1,
  transparent: true,
  opacity: 0.25,
  side: THREE.DoubleSide,
  envMapIntensity: 1.0,
  reflectivity: 1.0,
})

const dracoLoader = new DRACOLoader()
dracoLoader.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/")

const loader = new GLTFLoader()
loader.setDRACOLoader(dracoLoader)

loader.load(
  MODEL_URL,
  (gltf) => {
    const model = gltf.scene
    const box = new THREE.Box3().setFromObject(model)
    const center = box.getCenter(new THREE.Vector3())
    const size = box.getSize(new THREE.Vector3())
    model.position.sub(center)
    const maxDim = Math.max(size.x, size.y, size.z)
    camera.position.set(0, maxDim * 0.5, maxDim * 2)
    controls.minDistance = maxDim * 0.5
    controls.maxDistance = maxDim * 6
    model.traverse((child) => {
      if (child.isMesh) {
        child.material = glassMaterial
        child.castShadow = true
        child.receiveShadow = true
      }
    })
    scene.add(model)
  },
  undefined,
  (err) => console.error("GLB 로드 실패:", err)
)

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth, window.innerHeight)
})

function animate() {
  requestAnimationFrame(animate)
  controls.update()
  renderer.render(scene, camera)
}
animate()
</script>
</body>
</html>
